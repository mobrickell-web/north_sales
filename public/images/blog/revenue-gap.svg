<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03132B" />
      <stop offset="1" stop-color="#001528" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b17411" stop-opacity="0.85" />
      <stop offset="1" stop-color="#efb862" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)" />
  <rect width="1200" height="750" fill="url(#grid)" />

  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5">
    <path d="M150 600h900" />
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="300" y="360" width="220" height="240" rx="8" fill="url(#bar)" />
    <text x="410" y="650" fill="#ffffff" fill-opacity="0.8" font-size="16" font-weight="600" letter-spacing="0.10em">CURRENT REVENUE</text>

    <rect x="680" y="240" width="220" height="360" rx="8" fill="url(#bar)" />
    <text x="790" y="650" fill="#ffffff" fill-opacity="0.8" font-size="16" font-weight="600" letter-spacing="0.10em">POTENTIAL</text>
  </g>

  <g>
    <rect x="680" y="240" width="220" height="120" rx="8" fill="#03132B" fill-opacity="0.55" stroke="#efb862" stroke-width="2" stroke-dasharray="7 6" />
    <text x="790" y="290" text-anchor="middle" fill="#efb862" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0.08em">THE GAP</text>
    <text x="790" y="322" text-anchor="middle" fill="#ffffff" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="14">Already lost to a</text>
    <text x="790" y="343" text-anchor="middle" fill="#ffffff" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="14">fixable constraint</text>
  </g>

  <g>
    <path d="M540 300h100" fill="none" stroke="#efb862" stroke-width="2.5" stroke-linecap="round" />
    <path d="M628 288l16 12-16 12" fill="none" stroke="#efb862" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g>
    <rect x="70" y="696" width="1060" height="2" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="98" cy="726" r="5" fill="#b17411" />
    <text x="118" y="731" fill="#ffffff" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="15">Unconstrained revenue often already exists inside the current operation.</text>
  </g>
</svg>
