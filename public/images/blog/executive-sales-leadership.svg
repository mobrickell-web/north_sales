<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Executive leadership and sales manager supporting a stronger sales organization">
  <defs>
    <linearGradient id="esl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03132B" />
      <stop offset="1" stop-color="#001528" />
    </linearGradient>
    <pattern id="esl-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#esl-bg)" />
  <rect width="1200" height="750" fill="url(#esl-grid)" />

  <g font-family="Inter, Arial, sans-serif">
    <text x="600" y="88" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-size="17" font-weight="700" letter-spacing="0.12em">LEADERSHIP + MANAGER + TEAM</text>

    <g stroke="#b17411" stroke-width="2" stroke-opacity="0.55" fill="none">
      <path d="M300 420 L600 320 L900 420" />
      <path d="M600 320 L600 520" />
    </g>

    <g>
      <rect x="120" y="300" width="360" height="120" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#efb862" stroke-opacity="0.7" />
      <text x="300" y="352" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="16" font-weight="700" letter-spacing="0.10em">EXECUTIVE LEADERSHIP</text>
      <text x="300" y="382" text-anchor="middle" fill="#ffffff" fill-opacity="0.65" font-size="14">Clear priorities and alignment</text>
    </g>

    <g>
      <rect x="720" y="300" width="360" height="120" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#efb862" stroke-opacity="0.7" />
      <text x="900" y="352" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="16" font-weight="700" letter-spacing="0.10em">SALES MANAGER</text>
      <text x="900" y="382" text-anchor="middle" fill="#ffffff" fill-opacity="0.65" font-size="14">Coaching, pipeline, accountability</text>
    </g>

    <g>
      <rect x="420" y="520" width="360" height="120" rx="16" fill="#b17411" fill-opacity="0.22" stroke="#b17411" stroke-opacity="0.85" />
      <text x="600" y="572" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="16" font-weight="700" letter-spacing="0.10em">STRONGER SALES ORG</text>
      <text x="600" y="602" text-anchor="middle" fill="#ffffff" fill-opacity="0.70" font-size="14">Systems, skills, execution</text>
    </g>

    <g font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.78" text-anchor="middle">
      <g transform="translate(90,140)">
        <rect width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="100" y="28">Follow-up gaps</text>
      </g>
      <g transform="translate(310,140)">
        <rect width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="100" y="28">Stalled deals</text>
      </g>
      <g transform="translate(530,140)">
        <rect width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="100" y="28">Incomplete CRM</text>
      </g>
      <g transform="translate(750,140)">
        <rect width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="100" y="28">Unclear expectations</text>
      </g>
      <g transform="translate(970,140)">
        <rect width="140" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="70" y="28">Value comms</text>
      </g>
    </g>

    <text x="600" y="698" text-anchor="middle" fill="#ffffff" fill-opacity="0.45" font-size="13" letter-spacing="0.06em">Practical implementation alongside existing leadership</text>
  </g>
</svg>
