<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03132B" />
      <stop offset="1" stop-color="#001528" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b17411" stop-opacity="0.85" />
      <stop offset="1" stop-color="#efb862" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)" />
  <rect width="1200" height="750" fill="url(#grid)" />

  <g font-family="Inter, Arial, sans-serif">
    <text x="600" y="88" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-size="17" font-weight="700" letter-spacing="0.12em">VOLUME + QUALIFICATION</text>

    <!-- Raw prospect pool -->
    <g>
      <rect x="70" y="130" width="280" height="420" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
      <text x="210" y="168" text-anchor="middle" fill="#ffffff" fill-opacity="0.78" font-size="14" font-weight="600" letter-spacing="0.10em">PROSPECT POOL</text>
      <g fill="#efb862" fill-opacity="0.55">
        <circle cx="120" cy="210" r="8" /><circle cx="160" cy="195" r="8" /><circle cx="200" cy="220" r="8" /><circle cx="240" cy="200" r="8" /><circle cx="280" cy="215" r="8" /><circle cx="310" cy="235" r="8" />
        <circle cx="105" cy="255" r="8" /><circle cx="145" cy="270" r="8" /><circle cx="185" cy="250" r="8" /><circle cx="225" cy="265" r="8" /><circle cx="265" cy="255" r="8" /><circle cx="305" cy="280" r="8" />
        <circle cx="115" cy="310" r="8" /><circle cx="155" cy="325" r="8" /><circle cx="195" cy="305" r="8" /><circle cx="235" cy="320" r="8" /><circle cx="275" cy="310" r="8" /><circle cx="315" cy="335" r="8" />
        <circle cx="125" cy="365" r="8" /><circle cx="165" cy="380" r="8" /><circle cx="205" cy="360" r="8" /><circle cx="245" cy="375" r="8" /><circle cx="285" cy="365" r="8" /><circle cx="325" cy="390" r="8" />
        <circle cx="110" cy="420" r="8" /><circle cx="150" cy="435" r="8" /><circle cx="190" cy="415" r="8" /><circle cx="230" cy="430" r="8" /><circle cx="270" cy="420" r="8" /><circle cx="310" cy="445" r="8" />
        <circle cx="130" cy="475" r="8" /><circle cx="170" cy="490" r="8" /><circle cx="210" cy="470" r="8" /><circle cx="250" cy="485" r="8" /><circle cx="290" cy="475" r="8" /><circle cx="330" cy="500" r="8" />
      </g>
      <text x="210" y="530" text-anchor="middle" fill="#ffffff" fill-opacity="0.62" font-size="13">High volume of</text>
      <text x="210" y="552" text-anchor="middle" fill="#ffffff" fill-opacity="0.62" font-size="13">potential companies</text>
    </g>

    <!-- Arrow to AI -->
    <path d="M365 340h95" fill="none" stroke="#efb862" stroke-width="2.5" stroke-linecap="round" />
    <path d="M448 328l16 12-16 12" fill="none" stroke="#efb862" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- AI processing -->
    <g>
      <rect x="460" y="250" width="280" height="200" rx="14" fill="url(#bar)" fill-opacity="0.22" stroke="#efb862" stroke-width="2" />
      <text x="600" y="300" text-anchor="middle" fill="#efb862" font-size="22" font-weight="700" letter-spacing="0.14em">AI</text>
      <text x="600" y="332" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="14" font-weight="600">Research | Filter | Prioritize</text>
      <text x="600" y="378" text-anchor="middle" fill="#ffffff" fill-opacity="0.68" font-size="13">Against your ideal</text>
      <text x="600" y="400" text-anchor="middle" fill="#ffffff" fill-opacity="0.68" font-size="13">customer profile</text>
    </g>

    <!-- Arrow to priorities -->
    <path d="M755 340h95" fill="none" stroke="#efb862" stroke-width="2.5" stroke-linecap="round" />
    <path d="M838 328l16 12-16 12" fill="none" stroke="#efb862" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Priority tiers -->
    <g>
      <rect x="850" y="130" width="280" height="420" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
      <text x="990" y="168" text-anchor="middle" fill="#ffffff" fill-opacity="0.78" font-size="14" font-weight="600" letter-spacing="0.10em">PRIORITY GROUPS</text>

      <rect x="880" y="195" width="220" height="72" rx="8" fill="url(#bar)" />
      <text x="990" y="228" text-anchor="middle" fill="#001528" font-size="15" font-weight="700">PRIORITY A</text>
      <text x="990" y="252" text-anchor="middle" fill="#001528" fill-opacity="0.85" font-size="12">Best fit, strongest signals</text>

      <rect x="880" y="290" width="220" height="72" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#efb862" stroke-opacity="0.5" />
      <text x="990" y="323" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PRIORITY B</text>
      <text x="990" y="347" text-anchor="middle" fill="#ffffff" fill-opacity="0.75" font-size="12">Good fit, needs qualification</text>

      <rect x="880" y="385" width="220" height="72" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="990" y="418" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">PRIORITY C</text>
      <text x="990" y="442" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-size="12">Limited potential</text>

      <g>
        <circle cx="920" cy="510" r="18" fill="#efb862" fill-opacity="0.9" />
        <path d="M905 518c0-8.3 6.7-15 15-15s15 6.7 15 15" fill="none" stroke="#001528" stroke-width="3" stroke-linecap="round" />
        <circle cx="990" cy="510" r="18" fill="#efb862" fill-opacity="0.9" />
        <path d="M975 518c0-8.3 6.7-15 15-15s15 6.7 15 15" fill="none" stroke="#001528" stroke-width="3" stroke-linecap="round" />
        <circle cx="1060" cy="510" r="18" fill="#efb862" fill-opacity="0.9" />
        <path d="M1045 518c0-8.3 6.7-15 15-15s15 6.7 15 15" fill="none" stroke="#001528" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="990" y="555" text-anchor="middle" fill="#ffffff" fill-opacity="0.62" font-size="13">Sales team focuses on</text>
      <text x="990" y="577" text-anchor="middle" fill="#ffffff" fill-opacity="0.62" font-size="13">selling, not manual research</text>
    </g>
  </g>

  <g>
    <rect x="70" y="696" width="1060" height="2" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="98" cy="726" r="5" fill="#b17411" />
    <text x="118" y="731" fill="#ffffff" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="15">AI turns high-volume prospect lists into qualified, prioritized opportunities for your sales team.</text>
  </g>
</svg>
