<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Executive leadership, sales management, and salespeople aligned toward shared sales objectives">
  <defs>
    <linearGradient id="sfu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03132B" />
      <stop offset="1" stop-color="#001528" />
    </linearGradient>
    <pattern id="sfu-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#sfu-bg)" />
  <rect width="1200" height="750" fill="url(#sfu-grid)" />

  <g font-family="Inter, Arial, sans-serif">
    <text x="600" y="72" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-size="17" font-weight="700" letter-spacing="0.12em">SHARED OBJECTIVES + CLEAR ROLES + ONE TEAM</text>

    <circle cx="600" cy="340" r="72" fill="#b17411" fill-opacity="0.18" stroke="#b17411" stroke-opacity="0.85" stroke-width="2" />
    <text x="600" y="332" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="15" font-weight="700" letter-spacing="0.08em">SALES</text>
    <text x="600" y="358" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="15" font-weight="700" letter-spacing="0.08em">UNITY</text>

    <g stroke="#efb862" stroke-width="2" stroke-opacity="0.55" fill="none">
      <path d="M600 268 L600 180" />
      <path d="M528 382 L280 480" />
      <path d="M672 382 L920 480" />
    </g>

    <g>
      <rect x="420" y="120" width="360" height="88" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#efb862" stroke-opacity="0.7" />
      <text x="600" y="158" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="15" font-weight="700" letter-spacing="0.10em">EXECUTIVE LEADERSHIP</text>
      <text x="600" y="186" text-anchor="middle" fill="#ffffff" fill-opacity="0.65" font-size="13">Direction and expectations</text>
    </g>

    <g>
      <rect x="80" y="480" width="320" height="88" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#efb862" stroke-opacity="0.7" />
      <text x="240" y="518" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="15" font-weight="700" letter-spacing="0.10em">SALES MANAGERS</text>
      <text x="240" y="546" text-anchor="middle" fill="#ffffff" fill-opacity="0.65" font-size="13">Coaching and accountability</text>
    </g>

    <g>
      <rect x="800" y="480" width="320" height="88" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#efb862" stroke-opacity="0.7" />
      <text x="960" y="518" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-size="15" font-weight="700" letter-spacing="0.10em">SALESPEOPLE</text>
      <text x="960" y="546" text-anchor="middle" fill="#ffffff" fill-opacity="0.65" font-size="13">Execution with customers</text>
    </g>

    <g font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.78" text-anchor="middle">
      <g transform="translate(48,620)">
        <rect width="192" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="96" y="26">Energy and cooperation</text>
      </g>
      <g transform="translate(252,620)">
        <rect width="192" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="96" y="26">Resilience</text>
      </g>
      <g transform="translate(456,620)">
        <rect width="192" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="96" y="26">Trust and reporting</text>
      </g>
      <g transform="translate(660,620)">
        <rect width="192" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="96" y="26">Value confidence</text>
      </g>
      <g transform="translate(864,620)">
        <rect width="192" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="96" y="26">Motivation and growth</text>
      </g>
    </g>

    <text x="600" y="712" text-anchor="middle" fill="#ffffff" fill-opacity="0.45" font-size="13" letter-spacing="0.06em">Alignment across leadership, management, and the sales team</text>
  </g>
</svg>
